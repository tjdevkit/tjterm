name: Scaffold

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scaffold:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable Git symlinks on the Windows runner
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.7"
      - name: Check contributor instructions and migration plan
        run: |
          test -L CLAUDE.md
          test "$(readlink CLAUDE.md)" = AGENTS.md
          test -s AGENTS.md
          test -s plans/migration/PLAN.md
      - run: uv sync --locked
      - run: uv run --locked ruff check pyproject.toml
