name: Native standards

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  delivery:
    name: Native standards delivery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.7"
      - name: Install the wheel and pinned native clients
        run: |
          uv build
          uv venv --python 3.12 "$RUNNER_TEMP/tj"
          uv pip install --python "$RUNNER_TEMP/tj/bin/python" --no-deps dist/*.whl
          npm install --prefix "$RUNNER_TEMP/clients" --no-audit --no-fund @openai/codex@0.172.0 @anthropic-ai/claude-code@2.1.296
          echo "$RUNNER_TEMP/clients/node_modules/.bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/tj/bin" >> "$GITHUB_PATH"
      - name: Capture the first native request from a linked worktree
        run: uv run --locked --python 3.14 --script scripts/verify_native_startup.py
